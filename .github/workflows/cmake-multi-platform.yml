name: CMake Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libboost-system-dev \
            libboost-json-dev \
            libssl-dev \
            libpqxx-dev \
            libcurl4-openssl-dev \
            meson \
            ninja-build

      - name: Configure CMake
        # Флаг --fresh гарантирует, что старый кэш CMake не вызовет ошибку
        run: cmake -B build -S . --fresh -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build --config Release
