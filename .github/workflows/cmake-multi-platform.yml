name: CMake Build & Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Передаем имя артефакта в следующий шаг деплоя
    outputs:
      artifact-name: scand-binary
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libboost-system-dev \
            libboost-json-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            meson \
            ninja-build

      - name: Configure CMake
        run: cmake -B build -S . --fresh -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build --config Release -j$(nproc)

      # Сохраняем скомпилированный бинарник и конфиг как артефакт сборки
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scand-binary
          path: |
            build/scand
            build/config.ini

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' &&  github.ref == 'refs/heads/main'

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: scand-binary
          path: ./dist

      - name: Deploy to Server via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "./dist/*"
          target: "/scand"
          strip_components: 1

      - name: Restart Service via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            chmod +x /opt/scand/scand
            # Перезапускаем вашу systemd службу автоматического запуска
            sudo systemctl restart scand.service || echo "Служба scand.service еще не создана на сервере"
